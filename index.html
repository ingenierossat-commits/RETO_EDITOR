<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RETO · EDITOR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="ICONS/icon-192.png">
<link rel="icon" href="ICONS/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--pn:#151b23;--pn2:#1b232d;--ln:#27303b;--tx:#e6edf3;--mu:#8b98a8;--ac:#e3b341;--ok:#3fb950;--er:#f85149;--wa:#d29922;
--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--sans);padding-bottom:84px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font:600 .95rem var(--mono);letter-spacing:.12em;margin:0;flex:1}
header h1 b{color:var(--ac)}
#st{font:.72rem var(--mono);color:var(--mu);display:flex;align-items:center;gap:6px}
#st i{width:9px;height:9px;border-radius:50%;background:var(--er);display:inline-block}
#st.on i{background:var(--ok)}
main{max-width:760px;margin:0 auto;padding:14px 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 .68rem var(--mono);letter-spacing:.06em;padding:10px 2px 9px;min-height:54px;cursor:pointer;text-transform:uppercase}
nav button span{display:block;font-size:1.15rem;margin-bottom:2px}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
h2{font:600 .8rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:20px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.hint{color:var(--mu);font-size:.83rem;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
input[type=text],textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;min-height:42px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.b{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 13px;font:600 .82rem var(--mono);min-height:42px;cursor:pointer}
button.b:active{transform:scale(.97)}
button.p{background:var(--ac);color:#1a1405;border-color:var(--ac)}
button.d{color:var(--er)}
button.s{padding:6px 10px;min-height:36px}
button[disabled]{opacity:.4;pointer-events:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{white-space:nowrap}
.seg button.on{background:var(--ac);color:#1a1405;border-color:var(--ac)}
.n{font:.72rem var(--mono);color:var(--mu)}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.it>.grow{flex:1;min-width:0}
.opt{display:flex;gap:8px;align-items:center;margin-top:6px}
.opt input[type=radio]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.tg{display:inline-block;font:.72rem var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.tg.v{color:var(--ok);border-color:var(--ok)}.tg.f{color:var(--er);border-color:var(--er)}
.err{color:var(--er)}.wrn{color:var(--wa)}.okc{color:var(--ok)}
ul.v{margin:6px 0 0;padding-left:20px}
code,.mono{font-family:var(--mono);font-size:.82rem;word-break:break-all}
.tema{display:flex;gap:10px;align-items:center;padding:12px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;cursor:pointer}
.tema .grow{flex:1;min-width:0}
.tema b{display:block}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}
td.r,th.r{text-align:right;font-family:var(--mono)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal>div{background:var(--pn);width:100%;max-width:760px;border-radius:14px 14px 0 0;padding:16px;max-height:90vh;overflow:auto}
pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow:auto;max-height:240px;font:.75rem/1.4 var(--mono);white-space:pre}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ac);color:#1a1405;font:600 .82rem var(--mono);padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>RETO<b>·</b>EDITOR</h1><div id="st"><i></i><span>sin conexión</span></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="mbox"></div></div>
<div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
